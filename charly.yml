fonts-extended:
    candy:
        description: |
            The full CachyOS desktop font set — Noto CJK + emoji, Cantarell, DejaVu, Bitstream Vera, Open Sans, Meslo Nerd, and awesome-terminal glyphs — installed system-wide
            The full CachyOS desktop font set (the netinstall "fonts" subgroup) on
            top of the lean desktop-fonts layer: Noto (incl. CJK + emoji),
            Cantarell, DejaVu, Bitstream Vera, Open Sans, Meslo Nerd, and the
            awesome-terminal glyphs. Separate from desktop-fonts so the lightweight
            streaming-desktop images don't pull the heavy CJK set; a full KDE
            workstation wants it. Each family ships as an installed Arch package,
            so its presence is verifiable by querying the package database.
        require:
            - '@github.com/opencharly/layer-desktop-fonts:v2026.272.0015'
        distro:
            arch:
                package:
                    - noto-fonts
                    - noto-fonts-cjk
                    - noto-fonts-emoji
                    - cantarell-fonts
                    - ttf-bitstream-vera
                    - ttf-dejavu
                    - ttf-opensans
                    - ttf-meslo-nerd
                    - awesome-terminal-fonts
        plan:
            - check: the heavy Noto CJK font set — the reason this candy is split out from desktop-fonts — is installed
              package:
                package: noto-fonts-cjk
                installed: true
            - check: the Noto color-emoji font is installed
              package:
                package: noto-fonts-emoji
                installed: true
            - check: the Noto base Latin family is installed
              package:
                package: noto-fonts
                installed: true
            - check: the Cantarell GNOME UI font is installed
              package:
                package: cantarell-fonts
                installed: true
            - check: the DejaVu family is installed
              package:
                package: ttf-dejavu
                installed: true
            - check: the Bitstream Vera family is installed
              package:
                package: ttf-bitstream-vera
                installed: true
            - check: the Open Sans family is installed
              package:
                package: ttf-opensans
                installed: true
            - check: the Meslo Nerd patched font for terminal and powerline glyphs is installed
              package:
                package: ttf-meslo-nerd
                installed: true
            - check: the awesome-terminal-fonts glyph set is installed
              package:
                package: awesome-terminal-fonts
                installed: true

fonts-extended-skill:
    skill:
        name: fonts-extended
        family: selkies
        owner: fonts-extended
        description: |-
            The full CachyOS desktop font set (Noto CJK + emoji, Cantarell, DejaVu,
            Bitstream Vera, Open Sans, Meslo Nerd, awesome-terminal glyphs) on top of
            the lean desktop-fonts layer. Use when a full KDE/workstation image needs
            CJK and emoji coverage, or when adding a font family to a desktop image.
        content: |
            # fonts-extended — the full CachyOS desktop font set

            ## Candy Properties

            | Property | Value |
            |----------|-------|
            | Distro | Arch/CachyOS (`pac` only) |
            | Requires | `@github.com/opencharly/layer-desktop-fonts` — the lean base this extends |
            | Service | none (packages only) |

            ## What it installs

            The CachyOS netinstall "fonts" subgroup on top of the lean
            `desktop-fonts` layer: `noto-fonts` (Latin), `noto-fonts-cjk` (the heavy
            CJK set this candy is split out for), `noto-fonts-emoji`,
            `cantarell-fonts`, `ttf-bitstream-vera`, `ttf-dejavu`, `ttf-opensans`,
            `ttf-meslo-nerd`, and `awesome-terminal-fonts`.

            The split from `desktop-fonts` is deliberate: the lightweight
            streaming-desktop images must not pull the heavy CJK set, while a full
            KDE workstation wants it.

            ## Usage

            Compose it into a full workstation box (it layers on `desktop-fonts` via
            `require:`):

            ```yaml
            kde-workstation:
              candy:
                base: cachyos-base
                candy:
                  - '@github.com/opencharly/layer-fonts-extended:v2026.xxx.yyyy'
            ```

            ## Verification

            `plan:` `check:` steps assert each font family as an installed `arch`
            package (`noto-fonts-cjk` first — the reason the candy is split out), so
            presence is verifiable by querying the package database.

            ## Related

            - `/charly-selkies:desktop-fonts` — the lean JetBrains Mono + Nerd Fonts base this extends
            - `/charly-selkies:pipewire` — sibling desktop media/audio layer
            - `/charly-image:layer` — candy authoring reference
